[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "poppypurev2"
version = "0.1.0"
description = "Reproducible seven-class poppy seed adulteration classification"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.4.1",
  "Pillow==12.1.0",
  "scikit-learn==1.8.0",
  "scikit-image==0.26.0",
  "matplotlib==3.10.8",
  "torch==2.9.1",
  "torchvision==0.24.1",
]

[dependency-groups]
dev = ["ruff==0.15.6"]

[project.scripts]
poppypure = "poppypurev2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
